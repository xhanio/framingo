server: http
prefix: /auth
middlewares:
  - throttle
handlers:
  - method: POST
    path: /login
    func: Login
    middlewares:
      # This handler's own limit, overriding the group's throttle attachment
      # and the server's default config for it.
      - throttle:
          rps: 1
          burst_size: 3
  - method: POST
    path: /logout
    func: Logout
    middlewares:
      - authnuser
  - method: GET
    path: /session
    func: Session
    middlewares:
      - authnuser
