server: http
prefix: /auth
middlewares:
  - throttle
handlers:
  - method: POST
    path: /login
    func: Login
    middlewares:
      # overrides the group's and the server's throttle limit
      - throttle:
          rps: 1
          burst_size: 3
  - method: POST
    path: /logout
    func: Logout
    middlewares:
      - authnuser
  - method: GET
    path: /session
    func: Session
    middlewares:
      - authnuser
