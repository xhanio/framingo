server: http
prefix: /roles
middlewares:
  - throttle
  - authnuser
  - authz
# authz refuses a role that lacks the handler's permission, and fails closed:
# a handler that declares none is refused too. A route open to every
# signed-in user switches it off with `- authz: false`.
handlers:
  - method: POST
    path: /
    func: Create
    permission: role_write
  - method: GET
    path: /
    func: List
    permission: role_read
  - method: DELETE
    path: /:id
    func: Delete
    permission: role_write
  - method: PATCH
    path: /:id
    func: Update
    permission: role_write
  - method: GET
    path: /:id/permissions
    func: ListPermissions
    permission: role_read
  - method: PUT
    path: /:id/permissions
    func: SetPermissions
    permission: role_write
