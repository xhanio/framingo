server: http
prefix: /certificates
middlewares:
  - throttle
  - authnuser
  - authz
# authz fails closed: a handler declaring no permission is refused; open ones set `- authz: false`
handlers:
  - method: POST
    path: /
    func: Upload
    permission: certificate_write
  - method: GET
    path: /
    func: List
    permission: certificate_read
  - method: DELETE
    path: /
    func: Delete
    permission: certificate_write
  - method: GET
    path: /:id
    func: Get
    permission: certificate_read
  - method: PATCH
    path: /:id
    func: Update
    permission: certificate_write
  - method: POST
    path: /:id/download
    func: Download
    # write, not read: the download carries a local certificate's private key
    permission: certificate_write
  - method: GET
    path: /ca
    func: GetCA
    permission: certificate_read
  - method: POST
    path: /csr
    func: SignCSR
    permission: certificate_write
  - method: POST
    path: /generate
    func: Generate
    permission: certificate_write
