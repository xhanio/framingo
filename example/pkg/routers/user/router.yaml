# authz sits at group level, after authnuser: a handler-level entry wraps outermost
# and would run before the credential is set.
server: http
prefix: /users
middlewares:
  - throttle
  - authnuser
  - authz
handlers:
  - method: POST
    path: /
    func: Create
    permission: local_user_manage_write
  - method: GET
    path: /
    func: List
    permission: local_user_manage_read
  - method: DELETE
    path: /
    func: Delete
    permission: local_user_manage_write
  - method: GET
    path: /:id
    func: Get
    permission: local_user_manage_read
  - method: PATCH
    path: /:id
    func: Update
    permission: local_user_manage_write
  - method: PUT
    path: /:id/passwords
    func: ResetPassword
    permission: local_user_manage_write
---
# no :id: the caller's own account, resolved from the credential
server: http
prefix: /user
middlewares:
  - throttle
  - authnuser
  - authz
handlers:
  - method: GET
    path: /
    func: GetCurrent
    permission: local_user_read
  - method: PATCH
    path: /
    func: UpdateCurrent
    permission: local_user_write
  # authz refuses a caller whose password must be reset, and this is where it is reset
  - method: PUT
    path: /passwords
    func: ChangePassword
    middlewares:
      - authz: false
