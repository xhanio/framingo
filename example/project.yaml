# GoPro Configuration for Framingo Example
# Format: github.com/xhanio/gopro/pkg/types/config.go
#
# Two environments: local runs the stack under docker compose, prod deploys
# to Kubernetes. env/default holds what both share - the migrations.

product: framingo-example
version: v0.9.11

default:
  binary_src: build/binary
  binary_tgt: bin/
  binary_build_env:
    - CGO_ENABLED=1
  binary_build_args:
    - -v
    - -gcflags
    - '-N -l'
  image_build_src: build/image
  image_prefix: localhost:5000
  # the shared layer every env's config renders on top of: the migrations
  config_src: env/default/config
  config_tgt: dist/default/config

  binaries:
    - exampleapp
    - examplecli
  images:
    - postgres
    - exampleapp
  configs:
    - exampleapp

env:
  local:
    binary_build_env:
      - CGO_ENABLED=1

    config_src: env/local/config
    config_tgt: dist/local/config

    docker_compose_src: env/local/docker-compose
    docker_compose_tgt: dist/local

  prod:
    # replaces default's debug build args (-N -l disables optimization); -trimpath
    # keeps the build machine's paths out of the stack traces a 500 logs
    binary_build_args:
      - -v
      - -trimpath
    # image_prefix: registry.example.com/framingo-example   # your registry

    config_src: env/prod/config
    config_tgt: dist/prod/config

    kubernetes_src: env/prod/kubernetes
    kubernetes_tgt: dist/prod/kubernetes
    kubernetes_templates:
      - exampleapp

build:
  binaries:
    - name: exampleapp
      config_dir: dist/local/config/exampleapp
    - name: examplecli

  images:
    - name: postgres
      build_from: postgres:16-alpine
    - name: exampleapp
      base: ubuntu:22.04

generate:
  configs:
    - name: exampleapp
      files:
        - config.yaml
        - migrations/*.sql

  kubernetes:
    - name: exampleapp # every file in its template dir; template.* are rendered

  docker_compose:
    files:
      - docker-compose.yaml
