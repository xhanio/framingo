# Framingo Example Application Configuration (Local Environment)

# Logging configuration
log:
  level: -1  # -1=Debug, 0=Info, 1=Warn, 2=Error
  file: /home/xhan/log/framingo-example/app.log
  rotation:
    max_size: 100      # MB
    max_backups: 3
    max_age: 7         # days

# Database configuration - `db` is the service's config root (nameutil.ConfigRoot
# of its name); a second instance built with db.WithName("clickhouse") reads clickhouse.*
db:
  type: postgres
  source:
    host: localhost
    port: 5432
    user: framingo
    password: framingo_dev
    dbname: framingo_example
  migration:
    dir: ./dist/local/config/exampleapp/migrations
    version: 1
  connection:
    max_open: 10
    max_idle: 5
    max_lifetime: 1h
    exec_timeout: 30s

# Tracing configuration (OpenTelemetry)
tracing:
  enabled: true
  exporter: stdout     # otlpgrpc | otlphttp | stdout; blank-import the matching pkg/services/tracing/exporters/* package
  sample_ratio: 1.0    # ParentBased(TraceIDRatioBased): remote parents keep their sampling decision
                       # service.name/version come from the build's ApplicationName and
                       # ApplicationVersion - never from config
  # config:                    # exporter-specific kv block, strict-decoded by the chosen exporter
  #   endpoint: localhost:4317 # otlp: collector host:port, no scheme
  #   insecure: true
  #   headers: { authorization: "Bearer ..." }
  #   compression: gzip
  #   timeout: 10s
  #   retry: { initial_interval: 5s }

# Metrics configuration (OpenTelemetry)
metrics:
  enabled: true
  exporter: stdout     # otlpgrpc | otlphttp | stdout; blank-import the matching pkg/services/metrics/exporters/* package
  interval: 60s        # export loop period; default matches the SDK's 60s
                       # service.name/version come from the build's ApplicationName and
                       # ApplicationVersion - never from config
  # config:                    # exporter-specific kv block, strict-decoded by the chosen exporter
  #   endpoint: localhost:4317 # otlp: collector host:port, no scheme
  #   insecure: true
  #   headers: { authorization: "Bearer ..." }
  #   compression: gzip
  #   timeout: 10s
  #   retry: { initial_interval: 5s }

# API server configuration
api:
  health: # the probe listener: /healthz + /readyz, kept off the public server
    host: 0.0.0.0
    port: 8081
    prefix: /
  http:
    host: 0.0.0.0
    port: 8080
    prefix: /api/v1
    middlewares: # per-middleware default configs; router.yaml overrides per group or handler
      trace: true # the framework's tracing middleware; no entry on the health listener keeps probe polls untraced
      cors: true # the example's server-level cors middleware; permissive for local development
      throttle:
        rps: 100.0
        burst_size: 200

# Example service configuration
example:
  greeting: hello world!!!

# Optional: pprof profiling (enabled for local development)
pprof:
  port: 6060
