apiVersion: apps/v1
kind: Deployment
metadata:
  name: framingo-example
  labels:
    app: framingo-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: framingo-example
  template:
    metadata:
      labels:
        app: framingo-example
    spec:
      containers:
      - name: framingo-example
        image: [[ GetImageName "exampleapp" ]]
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 8081 # api.health: the probe listener
          name: health
          protocol: TCP
        - containerPort: 6060
          name: pprof
          protocol: TCP
        # Each variable overrides the config.yaml key it names - the product
        # prefix plus the key with dots as underscores - and beats the file.
        # GetEnvKey adds the prefix the binary was built with, so the two
        # cannot drift apart.
        env:
        - name: [[ GetEnvKey "DB_SOURCE_HOST" ]]
          valueFrom:
            configMapKeyRef:
              name: framingo-example-config
              key: db_host
        - name: [[ GetEnvKey "DB_SOURCE_PORT" ]]
          valueFrom:
            configMapKeyRef:
              name: framingo-example-config
              key: db_port
        - name: [[ GetEnvKey "DB_SOURCE_DBNAME" ]]
          valueFrom:
            configMapKeyRef:
              name: framingo-example-config
              key: db_name
        - name: [[ GetEnvKey "DB_SOURCE_USER" ]]
          valueFrom:
            secretKeyRef:
              name: framingo-example-secret
              key: db_user
        - name: [[ GetEnvKey "DB_SOURCE_PASSWORD" ]]
          valueFrom:
            secretKeyRef:
              name: framingo-example-secret
              key: db_password
        volumeMounts:
        - name: config
          mountPath: /etc/framingo-example
          readOnly: true
        - name: logs
          mountPath: /var/log/framingo-example
        # The supervisor's roll-ups, served on the health listener with no
        # auth or throttling: /healthz fails only once in-process recovery is
        # spent, /readyz while any service is not ready.
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: config
        configMap:
          name: framingo-example-config
      - name: logs
        emptyDir: {}
