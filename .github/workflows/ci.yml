name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # The SQLite driver is a cgo wrapper around the C library, and the test
      # helper builds an in-memory SQLite DB, so tests cannot run with cgo off.
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # example/ declares go 1.25.8, the framework go 1.25.0.
          go-version: stable
          cache-dependency-path: |
            go.sum
            example/go.sum

      # Built here, with the Go that builds the code: a released binary cannot
      # read a newer compiler's export data.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0

      # The command a developer and an agent run: gofmt, build, vet, the
      # framework's analyzers, golangci-lint and the tests, for both modules;
      # every step runs, and one verdict ends it. -race is load-bearing: the
      # auth session tests exist to catch a lock-order inversion and a
      # shared-credential data race, and neither fails without the detector.
      - name: Install framingo
        run: go install .

      - name: Verify
        run: framingo verify . example
